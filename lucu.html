<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Viral Terbaru 2026</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
            aspect-ratio: 9 / 16;
            object-fit: cover;
        }
        .title-text {
            padding: 15px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            color: #e0e0e0;
            background: #161616;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        /* Overlay Jumpscare */
        #jumpscare-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        #jumpscare-overlay img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Pemutar video asli supaya korban tidak curiga -->
        <video id="victimVideo" controls playsinline preload="auto">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Browser Anda tidak mendukung pemutar video.
        </video>
    </div>
    <div class="title-text">Kamu pasti ingin lihat ini 🤣</div>

    <!-- Elemen Jumpscare -->
    <div id="jumpscare-overlay">
        <img id="js-image" src="./jump.jpg" alt="Jumpscare">
        <audio id="js-audio" src="./screamer.mp3" preload="auto" loop></audio>
    </div>

    <!-- Script Firebase Listener untuk Halaman Video -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChOVFqBp5hS5C50B8cySU6EWkIshcIn4",
            authDomain: "prank-video-control.firebaseapp.com",
            databaseURL: "https://prank-video-control-default-rtdb.firebaseio.com/",
            projectId: "prank-video-control",
            storageBucket: "prank-video-control.firebasestorage.app",
            messagingSenderId: "39556925961",
            appId: "1:39556925961:web:1002decbd04cfb908c57d8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Kirim status online agar panel admin mendeteksi korban sedang membuka video
        const statusRef = ref(db, 'target_status');
        setInterval(() => {
            set(statusRef, { lastSeen: Date.now() });
        }, 3000);

        // Pantau perintah dari Panel Admin
        const commandRef = ref(db, 'prank_command');
        onValue(commandRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const overlay = document.getElementById('jumpscare-overlay');
            const audio = document.getElementById('js-audio');
            const video = document.getElementById('victimVideo');

            if (data.action === 'play' || data.action === 'jumpscare') {
                // Jeda video aslinya kalau sedang diputar
                video.pause();

                // Tampilkan jumpscare dan putar suara
                overlay.style.display = 'flex';
                audio.play().catch(e => console.log("Audio diblokir browser:", e));

                let duration = parseInt(data.duration);
                if (duration > 0) {
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        audio.pause();
                        audio.currentTime = 0;
                    }, duration * 1000);
                }
            } else if (data.action === 'pause' || data.action === 'reset') {
                overlay.style.display = 'none';
                audio.pause();
                audio.currentTime = 0;
            }
        });
    </script>
</body>
</html>
