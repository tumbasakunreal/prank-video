<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Lucu Gokil 2026</title>
    <style>
        body {
            background-color: #f4f4f9;
            color: #333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            color: #ff4757;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-share {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn-share:hover {
            background-color: #26af5f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔥 Video Kucing Lucu Bikin Ngakak!</h2>
        <p>Dijamin hilang stres seharian nonton ini 😂</p>

        <div class="video-box">
            <!-- Ganti link video di bawah ini dengan video lucu pilihanmu atau biarkan pakai video contoh -->
            <video id="funnyVideo" controls autoplay muted>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                Browser kamu tidak mendukung pemutar video.
            </video>
        </div>

        <button class="btn-share" onclick="alert('Bagikan video ini ke temanmu ya!')">Bagikan ke WhatsApp</button>
    </div>

</body>
</html>
