<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aceimg.com/upload</title>
    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* Header Navbar ala aceimg */
        .navbar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 16px;
            box-sizing: border-box;
            background: #ffffff;
        }
        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #111;
        }
        .btn-upload {
            background-color: #111827;
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Container Video Utama */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            background: #000;
        }

        /* Teks Footer di bawah video */
        .footer-text {
            padding: 20px 16px;
            font-size: 14px;
            color: #1d4ed8;
            text-align: center;
            font-weight: 500;
        }

        /* Overlay Jumpscare */
        #jumpscare-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        #jumpscare-overlay img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>

    <!-- Navbar Atas -->
    <div class="navbar">
        <div class="logo">aceimg</div>
        <button class="btn-upload" onclick="alert('Fitur upload sedang sibuk!')">Upload</button>
    </div>

    <!-- Pemutar Video -->
    <div class="video-container">
        <video id="victimVideo" controls playsinline preload="auto">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Browser Anda tidak mendukung pemutar video.
        </video>
    </div>

    <!-- Teks Bawah -->
    <div class="footer-text">Kamu pasti ingin lihat ini</div>

    <!-- Elemen Jumpscare -->
    <div id="jumpscare-overlay">
        <img id="js-image" src="./jump.jpg" alt="Jumpscare">
        <audio id="js-audio" src="./screamer.mp3" preload="auto" loop></audio>
    </div>

    <!-- Script Firebase Listener -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChOVFqBp5hS5C50B8cySU6EWkIshcIn4",
            authDomain: "prank-video-control.firebaseapp.com",
            databaseURL: "https://prank-video-control-default-rtdb.firebaseio.com/",
            projectId: "prank-video-control",
            storageBucket: "prank-video-control.firebasestorage.app",
            messagingSenderId: "39556925961",
            appId: "1:39556925961:web:1002decbd04cfb908c57d8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Kirim status online ke panel admin
        const statusRef = ref(db, 'target_status');
        setInterval(() => {
            set(statusRef, { lastSeen: Date.now() });
        }, 3000);

        // Pantau perintah dari Panel Admin
        const commandRef = ref(db, 'prank_command');
        onValue(commandRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const overlay = document.getElementById('jumpscare-overlay');
            const audio = document.getElementById('js-audio');
            const video = document.getElementById('victimVideo');

            if (data.action === 'play' || data.action === 'jumpscare') {
                video.pause();
                overlay.style.display = 'flex';
                audio.play().catch(e => console.log("Audio diblokir browser:", e));

                let duration = parseInt(data.duration);
                if (duration > 0) {
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        audio.pause();
                        audio.currentTime = 0;
                    }, duration * 1000);
                }
            } else if (data.action === 'pause' || data.action === 'reset') {
                overlay.style.display = 'none';
                audio.pause();
                audio.currentTime = 0;
            }
        });
    </script>
</body>
</html>
