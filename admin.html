<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .panel-box {
            max-width: 420px;
            margin: 0 auto;
            background: #1f1f1f;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #ff5252;
            letter-spacing: 1px;
        }
        .status-container {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border: 1px solid #444;
        }
        .dot {
            height: 12px;
            width: 12px;
            background-color: #555;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .dot.online {
            background-color: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
        }
        .custom-section {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #383838;
        }
        .custom-section label {
            display: block;
            font-size: 12px;
            color: #bbb;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        .custom-section label:first-child {
            margin-top: 0;
        }
        .custom-section input {
            width: 100%;
            padding: 8px 10px;
            background: #151515;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:active {
            transform: scale(0.97);
        }
        .btn-play { background-color: #27ae60; }
        .btn-pause { background-color: #d35400; }
        .btn-jumpscare { background-color: #c0392b; font-size: 17px; }
        .btn-reset { background-color: #2980b9; }
        
        #log-status {
            margin-top: 15px;
            font-size: 13px;
            color: #f1c40f;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="panel-box">
        <h2>ADMIN CONTROL</h2>

        <div class="status-container">
            <span>User Status:</span>
            <span class="dot" id="status-dot"></span>
            <span id="status-text">CHECKING...</span>
        </div>

        <!-- Menu Kustomisasi Jumpscare -->
        <div class="custom-section">
            <label><i class="fas fa-image"></i> Link Gambar Jumpscare:</label>
            <input type="text" id="input-image" value="https://raw.githubusercontent.com/tumbasakunreal/prank-video/main/jump.jpg">

            <label><i class="fas fa-volume-up"></i> Link Suara Horor (MP3):</label>
            <input type="text" id="input-sound" value="https://raw.githubusercontent.com/tumbasakunreal/prank-video/main/ahhh.mp3">

            <label><i class="fas fa-clock"></i> Durasi Tampil (Detik, 0 = Terus menerus):</label>
            <input type="number" id="input-duration" value="2" min="0" placeholder="Contoh: 2">
        </div>

        <div class="btn-group">
            <button class="btn-play" onclick="sendCommand('play')"><i class="fas fa-play"></i> PLAY</button>
            <button class="btn-pause" onclick="sendCommand('pause')"><i class="fas fa-pause"></i> PAUSE</button>
            <button class="btn-jumpscare" onclick="sendCommand('jumpscare')"><i class="fas fa-ghost"></i> JUMPSCARE</button>
            <button class="btn-reset" onclick="sendCommand('reset')"><i class="fas fa-sync-alt"></i> RESET</button>
        </div>

        <div id="log-status"></div>
    </div>

    <!-- Script Firebase Admin -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChOVFqBp5hS5C50B8cySU6EWkIshcIn4",
            authDomain: "prank-video-control.firebaseapp.com",
            databaseURL: "https://prank-video-control-default-rtdb.firebaseio.com/",
            projectId: "prank-video-control",
            storageBucket: "prank-video-control.firebasestorage.app",
            messagingSenderId: "39556925961",
            appId: "1:39556925961:web:1002decbd04cfb908c57d8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Pantau status target secara real-time (Online/Offline)
        const targetStatusRef = ref(db, 'target_status');
        onValue(targetStatusRef, (snapshot) => {
            const data = snapshot.val();
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');

            if (data && (Date.now() - data.lastSeen < 10000)) {
                dot.classList.add('online');
                text.innerText = 'ONLINE';
                text.style.color = '#2ecc71';
            } else {
                dot.classList.remove('online');
                text.innerText = 'OFFLINE';
                text.style.color = '#e74c3c';
            }
        });

        // Fungsi kirim perintah ke target beserta data kustomnya
        window.sendCommand = function(actionName) {
            const commandData = {
                action: actionName,
                time: Date.now()
            };

            // Jika tombol jumpscare yang diklik, sertakan data kustom dari input
            if (actionName === 'jumpscare') {
                commandData.image = document.getElementById('input-image').value;
                commandData.sound = document.getElementById('input-sound').value;
                commandData.duration = document.getElementById('input-duration').value;
            }

            const commandRef = ref(db, 'prank_command');
            set(commandRef, commandData).then(() => {
                const log = document.getElementById('log-status');
                log.innerText = `Perintah [${actionName.toUpperCase()}] berhasil dikirim!`;
                setTimeout(() => { log.innerText = ""; }, 2500);
            }).catch((error) => {
                alert("Gagal: " + error.message);
            });
        };
    </script>
</body>
</html>
