<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Prank Control</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            margin: 0;
        }
        h2 {
            margin-bottom: 30px;
        }
        .btn-prank {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-prank:active {
            background-color: #c0392b;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h2>Panel Kontrol Prank</h2>
    <p>Klik tombol di bawah untuk mengejutkan target:</p>
    <br>
    
    <!-- Tombol ini nanti yang akan memicu jumpscare -->
    <button class="btn-prank" onclick="triggerRemote()">TRIGGER JUMPSCARE!</button>

    <script>
        function triggerRemote() {
            // Untuk sementara kita tes lokal dulu, nanti kita sambungkan ke database
            alert("Tombol admin berhasil diklik! Tinggal kita hubungkan ke online.");
        }
    </script>

</body>
</html>
