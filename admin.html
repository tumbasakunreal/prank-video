<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #101010;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .subtitle {
            margin: 0 0 25px;
            color: #888888;
        }

        .status {
            padding: 15px;
            background: #181818;
            border: 1px solid #303030;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .status span {
            color: #35d06f;
            font-weight: bold;
        }

        .controls {
            display: grid;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #242424;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="panel">

        <h1>Admin Panel</h1>

        <p class="subtitle">
            Kontrol Video
        </p>

        <div class="status">
            Status: <span>Siap</span>
        </div>

        <div class="controls">

            <button>▶ Play Video</button>

            <button>⏸ Pause Video</button>

            <button>⏹ Stop Video</button>

        </div>

    </div>

</body>
</html>
