<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Terminal Core v7.1</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .header {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .terminal-screen {
            flex-grow: 1;
            background-color: #111;
            border: 2px solid #0f0;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
        }
        .btn-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding-bottom: 10px;
        }
        button {
            background-color: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 12px 5px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #0f0;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Overlay Jumpscare */
        #jumpscare-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        #jumpscare-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="header">:: ROOT_ACCESS CORE ACTIVE ::</div>
    
    <div class="terminal-screen" id="terminal">
System Initialized... Ready for input.
>
    </div>

    <div class="btn-container">
        <button id="btn1" onclick="startTyping('DB_DUMP')">Dump Database</button>
        <button id="btn2" onclick="startTyping('DECRYPT')">Decrypt Files</button>
        <button id="btn3" onclick="startTyping('INJECT')">Inject Payload</button>
        <button id="btn4" onclick="startTyping('BYPASS')">Bypass FW</button>
        <button id="btn5" onclick="startTyping('SCANNER')">Port Scan</button>
        <button id="btn6" onclick="startTyping('CRACKER')">Cracker</button>
    </div>

    <!-- Elemen Jumpscare Fullscreen dengan sumber file lokal -->
    <div id="jumpscare-overlay">
        <img id="js-image" src="jump.jpg" alt="Jumpscare">
        <audio id="js-audio" src="screamer.mp3" preload="auto" loop></audio>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const actionTexts = {
            'DB_DUMP': '>>> Initiating Database Dump...\n>>> Target: 192.168.1.102\n>>> [████████████████████] 92%\n>>> Extracting 2,456,112 records...\n>>> SUCCESS: Data saved to /tmp/db_dump.sql\n>',
            'DECRYPT': '>>> Decrypting /root/shadow...\n>>> Key Exchange... OK\n>>> Accessing sensitive files...\n>>> FILE LIST: users.pwd, keys.pem, config.ini\n>',
            'INJECT': '>>> Injecting Remote Access Payload...\n>>> Connecting to C2 Server 10.10.10.50...\n>>> Established. Awaiting Commands...\n>',
            'BYPASS': '>>> Bypassing Main Firewall v9.2...\n>>> Disabling IDS/IPS...\n>>> Access Route 10.x.x.x Established...\n>',
            'SCANNER': '>>> Scanning Network...\n>>> Host 172.16.0.5 - Port 21:OPEN, 80:OPEN, 443:OPEN...\n>',
            'CRACKER': '>>> Bruteforcing SSH service (192.168.1.5)...\n>>> Trying admin:password123... [FAILED]...\n>'
        };

        let isTyping = false;
        function startTyping(action) {
            if (isTyping) return;
            isTyping = true;
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);

            terminal.innerHTML += '\n';
            const textToType = actionTexts[action];
            let charIndex = 0;

            function typeNextChar() {
                if (charIndex < textToType.length) {
                    terminal.innerHTML += textToType.charAt(charIndex);
                    charIndex++;
                    terminal.scrollTop = terminal.scrollHeight;
                    setTimeout(typeNextChar, 35);
                } else {
                    isTyping = false;
                    buttons.forEach(btn => btn.disabled = false);
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }
            typeNextChar();
        }
    </script>

    <!-- Script Firebase Penerima Perintah Target -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChOVFqBp5hS5C50B8cySU6EWkIshcIn4",
            authDomain: "prank-video-control.firebaseapp.com",
            databaseURL: "https://prank-video-control-default-rtdb.firebaseio.com/",
            projectId: "prank-video-control",
            storageBucket: "prank-video-control.firebasestorage.app",
            messagingSenderId: "39556925961",
            appId: "1:39556925961:web:1002decbd04cfb908c57d8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Kirim status online setiap 3 detik
        const statusRef = ref(db, 'target_status');
        setInterval(() => {
            set(statusRef, { lastSeen: Date.now() });
        }, 3000);

        // Pantau perintah dari Admin
        const commandRef = ref(db, 'prank_command');
        onValue(commandRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const overlay = document.getElementById('jumpscare-overlay');
            const audio = document.getElementById('js-audio');

            if (data.action === 'play' || data.action === 'jumpscare') {
                overlay.style.display = 'flex';
                audio.play().catch(e => console.log("Audio play blocked:", e));

                let duration = parseInt(data.duration);
                if (duration > 0) {
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        audio.pause();
                        audio.currentTime = 0;
                    }, duration * 1000);
                }
            } else if (data.action === 'pause' || data.action === 'reset') {
                overlay.style.display = 'none';
                audio.pause();
                audio.currentTime = 0;
            }
        });
    </script>
</body>
</html>
